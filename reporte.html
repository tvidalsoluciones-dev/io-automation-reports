<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- METADATOS DE ELEGANCIA DEFINITIVA (MAQUILLAJE CORREGIDO) -->
    <meta property="og:title" content="INFORME DE AVANCE IO 📊">
    <meta property="og:description" content="Haga clic para registrar el progreso de campo.">
    <meta property="og:image" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/icon_final_io.jpg">
    <meta property="og:url" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/reporte.html">
    <meta property="og:type" content="website">

    <title>IO AUTOMATION - Reporte</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #38bdf8;
            --bg: #020617;
            --card-bg: #0f172a;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #1e40af, #0f172a);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--accent);
            margin: 0;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .form-card {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .field {
            margin-bottom: 20px;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-send {
            width: 100%;
            padding: 18px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 id="sede-label">REPORTE DE CAMPO</h1>
        <p id="encargado-label">Cargando datos...</p>
    </div>
    <div class="form-card">
        <div class="field"><label>Estado del Proyecto</label><select id="estado">
                <option value="NORMAL">✅ PROGRESO NORMAL</option>
                <option value="RETRASADO">⚠️ REGISTRA RETRASO</option>
                <option value="DETENIDO">🛑 OBRA DETENIDA</option>
            </select></div>
        <div class="field"><label>Avance Real (%)</label><input type="number" id="avance" placeholder="Ej: 25"></div>
        <div class="field"><label>Novedades y Observaciones</label><textarea id="novedad" rows="4"
                placeholder="Describa aquí cualquier evento relevante..."></textarea></div>
        <button class="btn-send" onclick="enviar()">ENVIAR REPORTE MAESTRO</button>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const s = p.get('s') || "DESCONOCIDA";
        const e = p.get('e') || "ADMIN";
        const t = p.get('t') || "573023907622";

        document.getElementById('sede-label').innerText = `SEDE: ${s.replace(/_/g, ' ')}`;
        document.getElementById('encargado-label').innerText = `Encargado: ${e}`;

        function enviar() {
            const ava = document.getElementById('avance').value || "0";
            const est = document.getElementById('estado').value;
            const nov = document.getElementById('novedad').value || 'Sin novedades particulares.';
            const fecha = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });

            // Estética Superior: Estructura de Bloque de Ingeniería
            const msg = `━━━━━━━━━━━━━━━\n` +
                `  �️ *IO AUTOMATION REPORT*\n` +
                `━━━━━━━━━━━━━━━\n\n` +
                `📍 *Sede:* ${s.replace(/_/g, ' ')}\n` +
                `👷 *Encargado:* ${e}\n\n` +
                `📊 *MÉTRICAS DE CAMPO:*\n` +
                `├ 📈 *Avance:* ${ava}%\n` +
                `└ ⚡ *Estado:* ${est}\n\n` +
                `📝 *Nota:* ${nov}\n\n` +
                `📅 _Registrado el ${fecha}_\n` +
                `━━━━━━━━━━━━━━━`;

            window.location.href = `https://wa.me/${t}?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>

</html>
