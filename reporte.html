<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- METADATOS TÁCTICOS WHATSAPP (EL MAQUILLAJE) -->
    <meta property="og:title" content="INFORME DE PROGRESO 📊">
    <meta property="og:description" content="Toque aquí para registrar el avance de planta.">
    <meta property="og:image" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/reporte-icon-2.png">
    <meta property="og:type" content="website">

    <title>IO AUTOMATION - Sistema Orion</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #38bdf8;
            --bg: #020617;
            --card-bg: #0f172a;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #1e40af, #0f172a);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--accent);
            margin: 0;
        }

        .form-card {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 1rem;
        }

        .btn-send {
            width: 100%;
            padding: 18px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 id="sede-name">REPORTE DE CAMPO</h1>
        <p id="encargado-name">Cargando datos...</p>
    </div>
    <div class="form-card">
        <div class="field">
            <label>Estado de Obra</label>
            <select id="estado">
                <option value="NORMAL">✅ PROGRESO NORMAL</option>
                <option value="RETRASADO">⚠️ CON RETRASO</option>
                <option value="DETENIDO">🛑 OBRA DETENIDA</option>
            </select>
        </div>
        <div class="field">
            <label>Avance Físico (%)</label>
            <input type="number" id="avance" placeholder="0-100">
        </div>
        <div class="field">
            <label>Novedades</label>
            <textarea id="novedad" rows="4" placeholder="Obstáculos críticos..."></textarea>
        </div>
        <button class="btn-send" onclick="enviarReporte()">ENVIAR POR WHATSAPP</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const s = params.get('s') || "SEDE";
        const e = params.get('e') || "ADMIN";
        const t = params.get('t') || "573023907622";
        document.getElementById('sede-name').innerText = `SEDE: ${s.replace(/_/g, ' ')}`;
        document.getElementById('encargado-name').innerText = `Encargado: ${e}`;
        function enviarReporte() {
            const ava = document.getElementById('avance').value;
            const est = document.getElementById('estado').value;
            const msg = `📊 *REPORTE IO*\n📍 *Sede:* ${s.replace(/_/g, ' ')}\n👷 *Encargado:* ${e}\n📈 *Avance:* ${ava}%\n📝 *Nota:* ${document.getElementById('novedad').value || 'Sin novedades'}`;
            window.location.href = `https://wa.me/${t}?text=${encodeURIComponent(msg)}`;
        }
    </script>
</body>

</html>
