    <title>IO AUTOMATION - Bienvenidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #38bdf8;
            --bg: #020617;
            --card-bg: #0f172a;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .hero {
            width: 100%;
            height: 45vh;
            background: url('bienvenida.jpg') center/cover;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--bg));
        }

        .content {
            width: 90%;
            max-width: 500px;
            z-index: 10;
            margin-top: -40px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: white;
            letter-spacing: -1px;
        }

        p {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .menu-item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .menu-item:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .icon {
            font-size: 1.5rem;
        }

        .text {
            text-align: left;
        }

        .text span {
            display: block;
            font-size: 0.65rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
        }

        .text b {
            font-size: 1rem;
        }

        .footer-logo {
            margin-top: 40px;
            opacity: 0.3;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 4px;
        }
    </style>
</head>

<body>
    <div class="hero"></div>
    <div class="content">
        <h1>BIENVENIDO A IO</h1>
        <p>Orquestando el futuro de la industria a través de tecnología inteligente.</p>

        <div class="menu-grid">
            <a href="https://wa.me/573023907622?text=Hola,%20me%20interesa%20conocer%20sus%20servicios%20de%20AUTOMATIZACIÓN."
                class="menu-item">
                <div class="icon">🛠️</div>
                <div class="text">
                    <span>Área Técnica</span>
                    <b>AUTOMATIZACIÓN INDUSTRIAL</b>
                </div>
            </a>

            <a href="https://wa.me/573023907622?text=Hola,%20me%20gustaría%20agendar%20una%20reunión%20estratégica."
                class="menu-item">
                <div class="icon">📅</div>
                <div class="text">
                    <span>Consultoría</span>
                    <b>AGENDAR CITA ESTRATÉGICA</b>
                </div>
            </a>

            <a href="https://tvidalsoluciones-dev.github.io/io-automation-reports/reporte.html" class="menu-item">
                <div class="icon">📊</div>
                <div class="text">
                    <span>Acceso de Campo</span>
                    <b>PORTAL DE REPORTES IO</b>
                </div>
            </a>
        </div>

        <div class="footer-logo">IO AUTOMATION</div>
    </div>
</body>

</html>
