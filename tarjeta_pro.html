<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- EL "MAQUILLAJE" PARA WHATSAPP -->
    <meta property="og:title" content="PRESENTACIÓN PROFESIONAL 🤝">
    <meta property="og:description"
        content="Haga clic para conocer nuestra propuesta de servicios. Calidad y cumplimiento.">
    <meta property="og:image" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/tarjeta_pro.jpg">
    <meta property="og:url" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/tarjeta_pro.html">
    <meta property="og:type" content="website">

    <title>Presentación de Servicios</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #0ea5e9;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .hero {
            width: 100%;
            height: 40vh;
            background: url('tarjeta_pro.jpg') center/cover;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, var(--bg), transparent);
        }

        .content {
            width: 90%;
            max-width: 450px;
            z-index: 10;
            margin-top: -60px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin: 0 auto 20px;
            background: white;
            padding: 10px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 5px 0;
        }

        .subtitle {
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .info-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            margin-top: 25px;
            border: 1px solid #e2e8f0;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        .btn-contact {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.2);
            transition: 0.3s;
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.3);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            opacity: 0.5;
            padding-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="hero"></div>
    <div class="content">
        <div class="info-card">
            <span class="subtitle" id="tag-servicios">Servicios Profesionales</span>
            <h1 id="nombre-cliente">Hola, ¡mucho gusto!</h1>
            <p class="description" id="texto-intro">Estamos comprometidos con brindarle la mejor solución técnica y
                profesional para su proyecto.</p>

            <a href="#" id="btn-wa" class="btn-contact">HABLAR POR WHATSAPP</a>
        </div>

        <div class="footer">Diseño Digital Exclusivo</div>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        const nom = p.get('n') || "Invitado";
        const emp = p.get('e') || "su proyecto";
        const msg_base = p.get('m') || "Me interesa conocer sus servicios.";
        const tel = p.get('t') || "573023907622"; // Teléfono default o del aliado

        document.getElementById('nombre-cliente').innerText = `¡Hola, ${nom}!`;
        document.getElementById('texto-intro').innerText = `Es un placer saludarle. Queremos presentarle nuestra propuesta personalizada para ${emp}. Quedamos atentos a sus dudas.`;

        const wa_url = `https://wa.me/${tel}?text=${encodeURIComponent('Hola, mi nombre es ' + nom + ' de ' + emp + '. ' + msg_base)}`;
        document.getElementById('btn-wa').href = wa_url;
    </script>
</body>

</html>
