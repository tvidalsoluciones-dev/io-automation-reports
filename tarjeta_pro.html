<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- EL PORTAL MAESTRO - EL MAQUILLAJE PARA WHATSAPP -->
    <meta property="og:title" content="PRESENTACIÓN PROFESIONAL 🤝">
    <meta property="og:description"
        content="Haga clic para conocer nuestra propuesta de servicios. Calidad y cumplimiento.">
    <meta property="og:image" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/tarjeta_pro.jpg">
    <meta property="og:url" content="https://tvidalsoluciones-dev.github.io/io-automation-reports/tarjeta_pro.html">
    <meta property="og:type" content="website">

    <title>Portal Profesional de Servicios</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #0ea5e9;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .hero {
            width: 100%;
            height: 35vh;
            background: url('tarjeta_pro.jpg') center/cover;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, var(--bg), transparent);
        }

        .content {
            width: 92%;
            max-width: 450px;
            z-index: 10;
            margin-top: -50px;
            text-align: center;
        }

        .info-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .subtitle {
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 5px 0 15px 0;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        /* Botonera de Navegación */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 15px rgba(30, 41, 59, 0.2);
        }

        .btn-accent {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-wa {
            background: #25d366;
            color: white;
            box-shadow: 0 8px 15px rgba(37, 211, 102, 0.2);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            opacity: 0.4;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="hero"></div>
    <div class="content">
        <div class="info-card">
            <span class="subtitle">Ecosistema Global de Servicios</span>
            <h1 id="nombre-cliente">¡Hola!</h1>
            <p class="description" id="texto-intro">Bienvenido a nuestro centro de gestión. Seleccione la opción que
                mejor se adapte a su necesidad actual.</p>

            <div class="button-stack">
                <a href="#" id="link-portafolio" class="btn btn-primary">
                    <span>📂</span> VER PORTAFOLIO Y PRECIOS
                </a>

                <a href="#" id="link-agenda" class="btn btn-accent">
                    <span>📅</span> AGENDAR CITA O CONSULTA
                </a>

                <a href="#" id="btn-wa" class="btn btn-wa">
                    <span>💬</span> CONTACTAR POR WHATSAPP
                </a>
            </div>
        </div>

        <div class="footer">Infraestructura Digital Premium</div>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        const nom = p.get('n') || "Invitado";
        const emp = p.get('e') || "su proyecto";
        const tel = p.get('t') || "573023907622";

        // Personalización de Bienvenida
        document.getElementById('nombre-cliente').innerText = `¡Hola, ${nom}!`;
        document.getElementById('texto-intro').innerText = `Es un placer saludarle de nuevo. Tenemos propuestas listas para ${emp}. ¿Por dónde desea comenzar?`;

        // Construcción de Links Internos (Pasando los parámetros)
        const paramsStr = `?n=${encodeURIComponent(nom)}&e=${encodeURIComponent(emp)}&t=${encodeURIComponent(tel)}`;

        document.getElementById('link-portafolio').href = `portafolio.html${paramsStr}`;
        document.getElementById('link-agenda').href = `agendar.html${paramsStr}`;

        // Link directo a WA
        const wa_url = `https://wa.me/${tel}?text=${encodeURIComponent('Hola, mi nombre es ' + nom + ' de ' + emp + '. Me gustaría conversar personalmente.')}`;
        document.getElementById('btn-wa').href = wa_url;
    </script>
</body>

</html>
